services:
  glm-chat-bridge:
    build: .
    container_name: glm-chat-mcp
    ports:
      - "8102:8102"  # OpenAI API
    environment:
      - PORT=8102
      - HEADLESS=true
      - CACHE=true
      - CACHE_TTL=300000
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_MAX=30
    volumes:
      - browser-data:/app/data/browser
    restart: unless-stopped
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8102/v1/status', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  browser-data:
